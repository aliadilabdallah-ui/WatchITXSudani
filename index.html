<style>
:root {
  --blue: #000000;
  --blue-dark: #2A2A2A;
  --yellow: #DCA523;
  --ink: #1A1A1A;
  --muted: #555A66;
  --line: #E3E5EA;
  --field: #8A8F99;
  --bg: #F2F3F7;
  --error: #B42318;
  --dot: #6B6B6B;
  --surface: #FFFFFF;
  --soft: #F2F3F7;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #F2F2F7; --muted: #B8BCC8; --line: #2C2C44; --field: #7A7F8C;
    --bg: #0C0C1C; --surface: #17172B; --soft: #222238; --error: #FF8A80;
    color-scheme: dark; --link: #DCA523;
  }
}
:root[data-theme="dark"] {
  --ink: #F2F2F7; --muted: #B8BCC8; --line: #2C2C44; --field: #7A7F8C;
  --bg: #0C0C1C; --surface: #17172B; --soft: #222238; --error: #FF8A80;
  color-scheme: dark; --link: #DCA523;
}
html { background: var(--blue); }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
}
[hidden] { display: none !important; }
a { color: var(--link, var(--blue)); }
a:hover { color: var(--blue-dark); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.on-dark :focus-visible { outline-color: var(--yellow); }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Header: logos top left in both languages, floats over the hero */
.topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 5; background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0)); }
.topbar .wrap { max-width: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; direction: ltr; }
.brands { display: flex; align-items: center; gap: 14px; }
.brands img { display: block; width: auto; }
.brands .sudani { height: 44px; }
.brands .watchit { height: 20px; }
.brands .divider { width: 1px; height: 28px; background: var(--dot); }
.lang-btn {
  min-height: 44px; padding: 0 14px; border: 1px solid #FFFFFF; border-radius: 999px;
  background: rgba(0,0,0,0.35); color: #FFFFFF; font: inherit; font-size: 15px;
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}

/* Landing is dark, like a streaming app */
body.is-landing { background: #000000; }
body.is-landing footer { color: #A0A0A0; padding-top: 24px; }
body.is-landing footer a { color: #A0A0A0 !important; }

/* Hero: moving poster wall behind the offer */
.hero { position: relative; overflow: hidden; background: #000000; color: #FFFFFF; padding: 92px 0 40px; }
.wall { direction: ltr; position: absolute; inset: -30% -20%; display: flex; flex-direction: column; gap: 14px; transform: rotate(-8deg); opacity: 0.7; pointer-events: none; }
.wall-row { display: flex; gap: 14px; width: max-content; animation: wall-left 70s linear infinite; }
.wall-row:nth-child(even) { animation-name: wall-right; animation-duration: 85s; }
.wall-row img { display: block; width: 120px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px; }
@keyframes wall-left { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes wall-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 50%, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.2) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 72%, #000000 100%); }
.hero-content { position: relative; z-index: 2; max-width: 560px; margin: 0 auto; padding: 0 16px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.hero h1 { margin: 0; font-size: 30px; line-height: 1.25; font-weight: 700; text-shadow: 0 2px 20px rgba(0,0,0,0.7); }
.hero .sub { margin: 0; font-size: 16px; line-height: 1.6; color: #E2E2E2; }
.hero .card { width: 100%; margin-top: 8px; text-align: start; color: var(--ink); border: 0; box-shadow: 0 24px 70px rgba(0,0,0,0.6); }
.benefits { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; text-align: start; }
.benefits li { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 1.5; }
.benefits svg { flex: none; margin-top: 2px; }

/* Featured banner: sharp poster on a blurred copy of itself */
.featured { position: relative; overflow: hidden; margin: 24px 16px 0; border-radius: 20px; background: #0B0B0B; color: #FFFFFF; }
.featured-bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(36px) brightness(0.45) saturate(1.2); }
.featured-inner { position: relative; display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 20px; }
.featured-img { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,0.55); }
.featured-text { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.eyebrow { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--yellow); text-transform: uppercase; }
.featured h2 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700; }
.featured p.desc { margin: 0; font-size: 16px; line-height: 1.6; color: #D8D8D8; }
.btn-yellow { margin-top: 6px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--yellow); color: #000000; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
.btn-yellow:hover { background: #F0B92E; }

/* Poster rail */
.rail-wrap { padding: 28px 0 0; color: #FFFFFF; }
.rail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; margin-bottom: 12px; }
.rail-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
.rail-nav { display: none; gap: 8px; }
.rail { list-style: none; margin: 0; display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 12px; scroll-padding-inline: 16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail-item { flex: none; width: 132px; scroll-snap-align: start; margin: 0; }
.rail-item img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 12px; background: #151515; transition: transform 250ms ease; }
.rail-item:hover img { transform: translateY(-4px); }
.round-btn {
  flex: none; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #FFFFFF;
  background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
[dir="rtl"] .flip { transform: scaleX(-1); }

/* Cards */
.stack { display: flex; flex-direction: column; gap: 20px; padding-bottom: 24px; }
.stack.overlap { margin-top: 0; }
.stack.plain { padding-top: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.card h1 { margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700; }
.muted { color: var(--muted); }
.lead { margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); }
.lead bdi { color: var(--ink); font-weight: 600; }
.price-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.price-row .label { font-size: 15px; color: var(--muted); }
.price-row .price { font-size: 26px; font-weight: 700; }
.note { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 15px; font-weight: 600; }
.phone { display: flex; align-items: stretch; min-height: 52px; border: 1px solid var(--field); border-radius: 12px; overflow: hidden; background: var(--surface); }
.phone.invalid, .otp.invalid { border-color: var(--error); }
.phone .cc { display: flex; align-items: center; padding: 0 14px; background: var(--soft); border-right: 1px solid var(--line); font-size: 16px; font-weight: 500; }
.phone input { flex: 1; min-width: 0; border: 0; padding: 0 14px; background: var(--surface); color: var(--ink); font: inherit; font-size: 18px; letter-spacing: 0.02em; }
.phone input:focus-visible { outline: none; }
.phone:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
.otp { min-height: 56px; border: 1px solid var(--field); border-radius: 12px; padding: 0 12px; background: var(--surface); color: var(--ink); font: inherit; font-size: 28px; letter-spacing: 0.5em; text-align: center; }
.error { margin: 0; font-size: 14px; color: var(--error); }
.help { margin: 0; font-size: 14px; color: var(--muted); }
.summary { background: var(--soft); border-radius: 12px; padding: 14px 16px; font-size: 15px; line-height: 1.5; }
.btn {
  min-height: 52px; border: 0; border-radius: 12px; background: var(--blue); color: #FFFFFF;
  font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 0 16px;
}
.btn:hover { background: var(--blue-dark); color: #FFFFFF; }
a.btn, a.btn:hover { color: #FFFFFF; }
.btn[disabled] { opacity: 0.6; cursor: progress; }
.link-btn { align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: none; color: var(--link, var(--blue)); font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; }
.link-btn.center { align-self: center; padding: 0 8px; }
.badge { width: 64px; height: 64px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.badge.ok { background: var(--blue); }
.badge.bad { border: 2px solid var(--error); }
.linkbox { display: flex; align-items: center; gap: 8px; border: 1px solid var(--field); border-radius: 12px; padding: 6px 6px 6px 14px; }
.linkbox span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.copy-btn { flex: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--field); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.5; }
.steps .n { flex: none; width: 32px; height: 32px; border-radius: 999px; background: var(--yellow); color: #000000; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.how { padding: 0 4px; }
.how h2, .next h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
.next { border-top: 1px solid var(--line); padding-top: 16px; }

footer { padding-bottom: 32px; font-size: 14px; color: var(--muted); }
footer p { margin: 0; line-height: 1.5; }
footer nav { display: flex; flex-wrap: wrap; gap: 0 20px; }
footer a { color: var(--muted) !important; padding: 12px 0; display: inline-block; }



/* Subscription card with a poster banner on top */
.buy-card { padding: 0; gap: 0; overflow: hidden; }
.buy-banner { position: relative; height: 168px; background: #111111; }
.buy-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
.buy-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.05) 100%); }
.buy-chip { position: absolute; z-index: 1; top: 12px; inset-inline-start: 12px; padding: 5px 10px; border-radius: 999px; background: var(--yellow); color: #000000; font-size: 13px; font-weight: 700; }
.buy-banner-text { position: absolute; z-index: 1; inset-inline: 20px; bottom: 14px; display: flex; flex-direction: column; gap: 2px; color: #FFFFFF; }
.buy-banner .price-row .label { color: #E2E2E2; }
.buy-banner .price-row .price { color: #FFFFFF; font-size: 28px; }
.buy-banner .note { color: #CFCFCF; font-size: 13px; }
.buy-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.btn-buy { background: var(--yellow); color: #000000; font-weight: 700; }
.btn-buy:hover { background: #F0B92E; color: #000000; }

/* Same look on phones as on desktop */
.hero .benefits { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px 18px; }
.hero .benefits li { font-size: 14px; }
#view-landing .how .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#view-landing .how .steps li { flex-direction: column; align-items: flex-start; gap: 10px; }


/* Display font */
.hero h1, .featured h2, .rail-head h2, .why h2, .how h2, .buy-mid h2, .buy-banner .price, .buy-chip, .why-item h3, .eyebrow,
#view-otp h1, #view-success h1, #view-error h1 { font-family: 'Alexandria', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; }
.hero h1 { font-weight: 800; letter-spacing: -0.01em; }
[lang="ar"] .hero h1 { line-height: 1.45; letter-spacing: 0; }
[lang="ar"] .featured h2, [lang="ar"] .why h2 { line-height: 1.4; }
.buy-banner .price-row .price { font-size: 23px; font-weight: 700; }

/* Why WATCH IT */
.why { padding: 32px 16px 0; color: #FFFFFF; }
.why h2 { margin: 0 0 14px; font-size: 22px; font-weight: 700; }
.why-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.why-item { background: linear-gradient(160deg, #1A1A1A 0%, #101010 100%); border: 1px solid #262626; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.why-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(220,165,35,0.14); color: var(--yellow); margin-bottom: 4px; }
.why-item h3 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.35; }
.why-item p { margin: 0; font-size: 13px; line-height: 1.55; color: #BDBDBD; }

/* Phones: keep the headline area clean (no poster titles behind it) */
@media (max-width: 959px) {
  .hero::after { background:
    linear-gradient(to bottom, rgba(0,0,0,0.94) 0%, rgba(0,0,0,0.9) 26%, rgba(0,0,0,0.45) 52%, rgba(0,0,0,0.55) 78%, #000000 100%); }
}

/* Inner screens match the dark landing */
body { background: #000000; }
footer { color: #A0A0A0; padding-top: 8px; }
footer a { color: #A0A0A0 !important; }
.btn { background: var(--yellow); color: #000000; font-weight: 700; }
.btn:hover { background: #F0B92E; color: #000000; }
a.btn, a.btn:hover { color: #000000; }
.badge.ok { background: var(--yellow); }
.badge.ok svg { stroke: #000000; }

.js-number { white-space: nowrap; }

/* Header back button */
.head-start { display: flex; align-items: center; gap: 12px; }
.head-back { flex: none; width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.85); background: rgba(0,0,0,0.35); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.head-back:hover { background: rgba(255,255,255,0.12); }
.head-back[hidden] { display: none; }
.inline-link { border: 0; background: none; padding: 4px 2px; min-height: 44px; font: inherit; font-size: 15px; font-weight: 700; color: #8A6300; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* Inner screens: poster wall behind, highlighted card */
.page-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #000000; }
.page-bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 45%, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0.55) 100%); }
body.is-landing .page-bg { display: none; }
body:not(.is-landing) .topbar { position: relative; z-index: 2; background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0)); }
#view-otp, #view-success, #view-error, footer { position: relative; z-index: 1; }
.stack.plain .card { border: 0; box-shadow: 0 0 0 1.5px rgba(220,165,35,0.75), 0 0 70px rgba(220,165,35,0.18), 0 30px 80px rgba(0,0,0,0.7); }
.stack.plain h1 { font-size: 28px; }


/* Layout switch: ?layout=mid puts the subscription card in the middle of the page */
.btn-hero, .buy-mid { display: none; }
body.layout-mid .btn-hero { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 32px; font-size: 18px; margin-top: 10px; }
body.layout-mid .buy-mid { display: block; position: relative; margin: 24px 16px 0; padding: 32px 16px; border-radius: 20px; text-align: center; color: #FFFFFF;
  background: radial-gradient(ellipse 80% 90% at 50% 0%, rgba(220,165,35,0.28) 0%, rgba(220,165,35,0) 70%), #0E0E0E; border: 1px solid #262626; }
.buy-mid h2 { margin: 0; font-size: 26px; font-weight: 700; }
.buy-mid-sub { margin: 8px 0 20px; color: #D8D8D8; font-size: 16px; }
.buy-mid .card { max-width: 460px; margin: 0 auto; text-align: start; color: var(--ink); border: 0; box-shadow: 0 24px 70px rgba(0,0,0,0.6); }
@media (min-width: 960px) {
  body.layout-mid .hero { min-height: min(820px, 100vh); }
  body.layout-mid .buy-mid { margin: 24px 48px 0; padding: 56px 48px; border-radius: 24px; }
  .buy-mid h2 { font-size: 40px; }
  .buy-mid-sub { font-size: 18px; margin-bottom: 28px; }
  .buy-mid .card { padding: 0; }
}

/* ---------- Desktop (960px+) ---------- */
@media (min-width: 960px) {
  .topbar .wrap { padding: 20px 48px; }
  .brands .sudani { height: 56px; }

  .wall { gap: 18px; opacity: 0.55; }

  .hero-content { max-width: 760px; gap: 14px; }

  .buy-banner .price-row .price { font-size: 26px; }
  .why { padding: 48px 48px 0; }

  .why-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .why-item { padding: 22px; }
  .why-item h3 { font-size: 17px; }
  .why-item p { font-size: 14px; }
  .buy-banner { height: 200px; }
  .buy-banner-text { inset-inline: 28px; bottom: 18px; }
  .buy-body { padding: 24px 28px 28px; }
  .hero .benefits li { font-size: 16px; }
  #view-landing .how .steps { display: flex; }

  .featured-inner { flex-direction: row-reverse; align-items: center; gap: 56px; padding: 48px 56px; }
  .featured-img { width: min(640px, 52%); }
  .featured-text { flex: 1; gap: 12px; }
  .featured h2 { font-size: 48px; }

  #view-landing > .wrap { max-width: none; padding: 0 48px; }

  var $ = function (id) { return document.getElementById(id); };
  var state = { lang: 'ar', msisdn: null, link: null, slide: 0, playing: true };
  var t = function (key) { return STR[state.lang][key]; };

  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  // Accepts 0123456789, 123456789, +249123456789, 249 12 345 6789 -> "249123456789" or null
  function normalizeMsisdn(value) {
    var d = String(value || '').replace(/\D/g, '');
    if (d.indexOf('249') === 0) d = d.slice(3);
    if (d.indexOf('0') === 0) d = d.slice(1);
    return (d.length === 9 && d.charAt(0) === '1') ? '249' + d : null;
  }
  function prettyMsisdn(m) {
    var d = m.slice(3);
    return '+249 ' + d.slice(0, 2) + ' ' + d.slice(2, 5) + ' ' + d.slice(5);
  }

  /* ---------- API (backend proxies Huawei SDP; never call SDP from the browser) ---------- */
  function post(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  var api = {
    requestOtp: function (msisdn) {
      if (CONFIG.mockMode) return new Promise(function (res) { setTimeout(function () { res({ ok: true }); }, 600); });
      return post(CONFIG.endpoints.requestOtp, { msisdn: msisdn, lang: state.lang });
    },
    // Expected response: { status: 'success' | 'wrong_otp' | 'expired_otp' | 'insufficient_balance' | 'error', activationLink?: string }
    confirm: function (msisdn, otp) {
      if (CONFIG.mockMode) {
        return new Promise(function (res) {
          setTimeout(function () {
            if (otp === '000000') return res({ status: 'wrong_otp' });
            if (otp === '111111') return res({ status: 'insufficient_balance' });
            res({ status: 'success', activationLink: 'https://campaign.watchit.com/#/promocode?code=DEMO' });
          }, 800);
        });
      }
      return post(CONFIG.endpoints.confirm, { msisdn: msisdn, otp: otp });
    }

      }
      var s = document.createElement('span');
      s.textContent = text;
      li.appendChild(s);
      el.appendChild(li);
    });
  }

    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-alt]').forEach(function (el) { el.alt = t(el.getAttribute('data-i18n-alt')); });
    document.querySelectorAll('[data-i18n-label]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-label'))); });
    $('langBtn').setAttribute('aria-label', t('langAria'));
    $('backBtn').setAttribute('aria-label', t('backAria'));
    $('railPrev').setAttribute('aria-label', t('railPrev'));
    $('railNext').setAttribute('aria-label', t('railNext'));
    fillList($('benefits'), t('benefits'), false);
    buildWhy();
    fillList($('howSteps'), t('steps'), true);
    fillList($('nextSteps'), t('nextSteps'), true);
    if (state.msisdn) document.querySelectorAll('.js-number').forEach(function (el) { el.textContent = prettyMsisdn(state.msisdn); });
    if (!$('phoneError').hidden) $('phoneError').textContent = t('phoneError');
    buildPosters();
    updateTimerText();
  }

  var WHY_ICONS = [
      '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
      '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M10 9.5v4l3.5-2z"/>',
      '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.5 14.2c2.4-.3 4.5 1.2 5 4.3"/>',
      '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/>'
    ];
  function buildWhy() {
    var g = $('whyGrid');
    g.innerHTML = '';
    t('why').forEach(function (item, i) {
      var li = document.createElement('li');
      li.className = 'why-item';
      li.innerHTML = '<span class="why-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + WHY_ICONS[i] + '</svg></span>';
      var h = document.createElement('h3'); h.textContent = item[0];
      var p = document.createElement('p'); p.textContent = item[1];
      li.appendChild(h); li.appendChild(p);
      g.appendChild(li);
    });
  }

  window.addEventListener('popstate', function (e) {
    var v = e.state && e.state.view;
    if (v === 'otp' && !state.msisdn) v = null;
    if (typeof resendTimer !== 'undefined') clearInterval(resendTimer);
    show(v && VIEWS.indexOf(v) > -1 ? v : 'landing', true);
  });

  /* ---------- views ---------- */
  var VIEWS = ['landing', 'otp', 'success', 'error'];
  var currentView = 'landing';
  var hadPrevPage = history.length > 1;
  $('backBtn').addEventListener('click', function () {
    if (currentView === 'landing') { history.back(); return; }
    if (typeof resendTimer !== 'undefined') clearInterval(resendTimer);
    if (history.state && history.state.view) history.back(); else show('landing');
  });
  function show(name, fromHistory) {
    if (!fromHistory) {
      if (name === 'otp') history.pushState({ view: 'otp' }, '');
      else if (name === 'success' || name === 'error') history.replaceState({ view: name }, '');
      else if (history.state && history.state.view) history.back();
    }
    VIEWS.forEach(function (v) { $('view-' + v).hidden = v !== name; });
    document.body.classList.toggle('is-landing', name === 'landing');
    currentView = name;
    $('backBtn').hidden = name === 'landing' && !hadPrevPage;
    window.scrollTo(0, 0);
    var h = $('view-' + name).querySelector('h1[tabindex]');
    if (h) h.focus({ preventScroll: true });
  }

  /* ---------- layout: card in the hero (default) or in the middle (?layout=mid) ---------- */
  var layoutParam = new URLSearchParams(location.search).get('layout');
  if (layoutParam === 'mid') {
    document.body.classList.add('layout-mid');
    $('buyMidSlot').appendChild(document.querySelector('#view-landing .hero .card'));
  }

  /* ---------- posters: wall behind the hero + rail ---------- */
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function posterName(p) { return state.lang === 'ar' ? p.ar : p.en; }
  function buildPosters() {
    var rail = $('rail');
    ['wall', 'wall2'].forEach(function (wid) {
    var wall = $(wid);
    if (!wall.childElementCount) {
      for (var r = 0; r < 8; r++) {
        var row = document.createElement('div');
        row.className = 'wall-row';
        var order = POSTERS.slice(r * 5 % POSTERS.length).concat(POSTERS.slice(0, r * 5 % POSTERS.length));
        order.concat(order).forEach(function (p) {
          var im = document.createElement('img');
          im.src = p.src; im.alt = ''; im.decoding = 'async';
          row.appendChild(im);
        });
        wall.appendChild(row);
      }
    }
    });
    rail.innerHTML = '';
    POSTERS.forEach(function (p) {
      var li = document.createElement('li');
      li.className = 'rail-item';
      var im = document.createElement('img');
      im.src = p.src; im.alt = posterName(p); im.loading = 'lazy'; im.draggable = false;
      li.appendChild(im);
      rail.appendChild(li);
    });
  }
  function scrollRail(dir) {
    var rail = $('rail'), d = rail.clientWidth * 0.8 * dir;
    if (state.lang === 'ar') d = -d;
    rail.scrollBy({ left: d, behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  $('railPrev').addEventListener('click', function () { scrollRail(-1); });
  $('railNext').addEventListener('click', function () { scrollRail(1); });
  document.querySelectorAll('.js-buy').forEach(function (b) {
    b.addEventListener('click', function () {
      $('msisdn').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
      setTimeout(function () { $('msisdn').focus({ preventScroll: true }); }, reduceMotion ? 0 : 450);
    });
  });

  /* ---------- step 1: number ---------- */
  function setPhoneError(on) {
    $('phoneError').hidden = !on;
    $('phoneError').textContent = on ? t('phoneError') : '';
    $('phoneBox').classList.toggle('invalid', on);
    $('msisdn').setAttribute('aria-invalid', on ? 'true' : 'false');
  }
  $('msisdn').addEventListener('input', function () { setPhoneError(false); });
  $('msisdn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('sendBtn').click(); });

  function busy(btn, labelKey, on) {
    btn.disabled = on;
    btn.textContent = on ? t(labelKey) : t(btn.getAttribute('data-i18n'));
  }

  $('sendBtn').addEventListener('click', function () {
    var m = normalizeMsisdn($('msisdn').value);
    if (!m) { setPhoneError(true); $('msisdn').focus(); return; }
    busy($('sendBtn'), 'sending', true);
    api.requestOtp(m).then(function () {
      state.msisdn = m;
      document.querySelectorAll('.js-number').forEach(function (el) { el.textContent = prettyMsisdn(m); });
      $('otp').value = '';
      setOtpError(null);
      show('otp');
      startResendTimer();
      $('otp').focus();
    }).catch(function () {
      $('phoneError').hidden = false;
      $('phoneError').textContent = t('generic');
    }).then(function () { busy($('sendBtn'), 'sending', false); });
  });

  /* ---------- step 2: OTP ---------- */
  var resendLeft = 0, resendTimer = null;
  function updateTimerText() {
    $('resendBtn').hidden = resendLeft > 0;
    $('resendTimer').hidden = resendLeft <= 0;
    $('resendTimer').textContent = t('resendIn') + ' 0:' + String(resendLeft).padStart(2, '0');
  }
  function startResendTimer() {
    clearInterval(resendTimer);
    resendLeft = CONFIG.resendSeconds;
    updateTimerText();
    resendTimer = setInterval(function () {
      resendLeft -= 1;
      if (resendLeft <= 0) { resendLeft = 0; clearInterval(resendTimer); }
      updateTimerText();
    }, 1000);
  }
  function setOtpError(key) {
    $('otpError').hidden = !key;
    $('otpError').textContent = key ? t(key) : '';
    $('otp').classList.toggle('invalid', !!key);
    $('otp').setAttribute('aria-invalid', key ? 'true' : 'false');
  }
  $('otp').addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, CONFIG.otpLength);
    setOtpError(null);
  });
  $('otp').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('confirmBtn').click(); });
  $('resendBtn').addEventListener('click', function () {
    api.requestOtp(state.msisdn).then(startResendTimer).catch(function () { setOtpError('generic'); });
  });
  $('changeNumberBtn').addEventListener('click', function () { clearInterval(resendTimer); show('landing'); $('msisdn').focus(); });

  $('confirmBtn').addEventListener('click', function () {
    var otp = $('otp').value;
    if (otp.length < CONFIG.otpLength) { setOtpError('otpIncomplete'); $('otp').focus(); return; }
    busy($('confirmBtn'), 'confirming', true);
    api.confirm(state.msisdn, otp).then(function (res) {
      if (res.status === 'success') {
        clearInterval(resendTimer);
        state.link = res.activationLink;
        $('linkText').textContent = res.activationLink.replace(/^https?:\/\//, '');
        $('openLink').href = res.activationLink;
        $('copyLabel').textContent = t('copy');
        show('success');
      } else if (res.status === 'insufficient_balance') {
        clearInterval(resendTimer);
        show('error');
      } else if (res.status === 'wrong_otp' || res.status === 'expired_otp') {
        setOtpError('otpWrong');
        $('otp').focus();
      } else {
        setOtpError('generic');
      }
    }).catch(function () { setOtpError('generic'); })
      .then(function () { busy($('confirmBtn'), 'confirming', false); });
  });

  /* ---------- step 3: success ---------- */
  $('copyBtn').addEventListener('click', function () {
    var done = function () { $('copyLabel').textContent = t('copied'); };
    if (navigator.clipboard && state.link) navigator.clipboard.writeText(state.link).then(done, done); else done();
  });

  document.querySelectorAll('.js-restart').forEach(function (b) {
    b.addEventListener('click', function () { show('landing'); });
  });

  /* ---------- init ---------- */
  $('langBtn').addEventListener('click', function () { applyLang(state.lang === 'ar' ? 'en' : 'ar'); });
  var q = new URLSearchParams(location.search).get('lang');
  var initial = (q === 'en' || q === 'ar') ? q : (load('wi_lang') || 'ar');
  applyLang(initial);
  show('landing');
})();
</script>
</body>
</html>
